<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lumen Spike 1 — Passkey</title>
<style>
  :root { --bg:#FBFBF9; --surface:#fff; --ink:#141413; --ink-2:#5C5B57; --line:#E8E6E1; --up:#2F7D5B; --down:#B5523B; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width:560px; margin:64px auto; padding:0 16px; }
  h1 { font-weight:500; letter-spacing:-0.02em; font-size:28px; margin:0 0 4px; }
  p { color:var(--ink-2); margin:0 0 24px; }
  .card { background:var(--surface); border:1px solid var(--line); border-radius:20px; padding:24px; box-shadow:0 1px 2px rgba(20,20,19,.04),0 8px 24px rgba(20,20,19,.06); }
  .row { display:flex; gap:12px; flex-wrap:wrap; }
  button { border:0; border-radius:999px; padding:10px 20px; font:inherit; background:var(--ink); color:#fff; cursor:pointer; }
  button.secondary { background:transparent; color:var(--ink); border:1px solid var(--line); }
  pre { background:#F4F3EF; border-radius:12px; padding:16px; overflow:auto; font-size:13px; white-space:pre-wrap; word-break:break-all; margin:20px 0 0; }
  .ok { color:var(--up); } .err { color:var(--down); }
</style>
</head>
<body>
<main>
  <h1>Spike 1 · Passkey sign-in</h1>
  <p>Creates a passkey, signs an empty intent with it, and exchanges that for a Confidential Intents session. No money moves.</p>
  <div class="card">
    <div class="row">
      <button id="create">Create passkey</button>
      <button id="signin" class="secondary">Sign in with passkey</button>
      <button id="forget" class="secondary">Forget</button>
    </div>
    <pre id="log">Ready.</pre>
  </div>
</main>
<script>
const b64u = {
  enc: (buf) => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""),
  dec: (s) => Uint8Array.from(atob(s.replace(/-/g, "+").replace(/_/g, "/")), (c) => c.charCodeAt(0)),
};
const logEl = document.getElementById("log");
const log = (msg, cls) => { logEl.className = cls || ""; logEl.textContent = typeof msg === "string" ? msg : JSON.stringify(msg, null, 2); };
const KEY = "lumen-spike1-passkey";
const stored = () => { try { return JSON.parse(localStorage.getItem(KEY)); } catch { return null; } };

async function post(path, body) {
  const r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}

document.getElementById("create").onclick = async () => {
  try {
    const cred = await navigator.credentials.create({ publicKey: {
      rp: { name: "Lumen spike", id: location.hostname },
      user: { id: crypto.getRandomValues(new Uint8Array(16)), name: "lumen-spike", displayName: "Lumen spike" },
      challenge: crypto.getRandomValues(new Uint8Array(32)),
      pubKeyCredParams: [{ type: "public-key", alg: -7 }], // ES256 = P-256
      authenticatorSelection: { residentKey: "preferred", userVerification: "preferred" },
    }});
    const spki = new Uint8Array(cred.response.getPublicKey());
    const pub64 = spki.slice(spki.length - 64); // uncompressed point x‖y, without the 0x04 prefix
    localStorage.setItem(KEY, JSON.stringify({ id: cred.id, publicKey: b64u.enc(pub64) }));
    log("Passkey created. Now click “Sign in with passkey”.", "ok");
  } catch (e) { log(e.message, "err"); }
};

document.getElementById("signin").onclick = async () => {
  const p = stored();
  if (!p) return log("Create a passkey first.", "err");
  try {
    log("Building empty intent…");
    const { signerId, payload, challenge } = await post("/api/challenge", { publicKey: p.publicKey });
    const a = await navigator.credentials.get({ publicKey: {
      challenge: b64u.dec(challenge),
      allowCredentials: [{ type: "public-key", id: b64u.dec(p.id) }],
      userVerification: "preferred",
    }});
    const res = await post("/api/authenticate", {
      payload,
      publicKey: p.publicKey,
      signatureDer: b64u.enc(a.response.signature),
      clientDataJSON: new TextDecoder().decode(a.response.clientDataJSON),
      authenticatorData: b64u.enc(a.response.authenticatorData),
    });
    log({ result: "PASS — passkey session issued", signerId, ...res }, "ok");
  } catch (e) { log("FAIL — " + e.message, "err"); }
};

document.getElementById("forget").onclick = () => { localStorage.removeItem(KEY); log("Forgotten."); };
</script>
</body>
</html>
